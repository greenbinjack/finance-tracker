<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance Tracker — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0b;
      color: #fafafa;
      text-align: center;
      padding: 24px;
    }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 18px; margin: 0; }
    p { margin: 0; color: #a1a1aa; font-size: 14px; max-width: 280px; }
    button {
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>Finance Tracker needs a connection to load your data. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
